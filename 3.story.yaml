          {storyData?.author?.userName}
        </div>
      </div>

      <div className="absolute top-[10px] left-0 w-full h-[5px] bg-gray-900">
        <div
          className="h-full bg-white w-[200px] transition-all duration-200 ease-linear"
          style={{ width: `${progress}%` }}
