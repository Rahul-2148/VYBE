import uploadOnCloudinary from "../config/cloudinary.js";
import { Story } from "../models/story.model.js";
import { User } from "../models/user.model.js";

export const uploadStory = async (req, res) => {
  try {
    const author = req.userId; // auth middleware
    const { mediaType, location, hashtags, music } = req.body;
    let media;
    if (req.file) {
      media = await uploadOnCloudinary(req.file.path, "VYBE/stories");
    } else {
      return res.status(400).json({ message: "Media is required" });
    }

    const story = await Story.create({
      mediaType,
      media,
      author,
      location,
      hashtags,
      music,
    });

    const user = await User.findById(req.userId);
    user.stories.push(story._id);
    await user.save();

    const populatedStory = await Story.findById(story._id)
      .populate("author", "name userName profileImage")
      .populate("viewers", "name userName profileImage");

    return res.status(200).json({
      success: true,
      error: false,
      story: populatedStory,
      message: "Story uploaded successfully",
    });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `uploadStory error: ${error.message}` });
  }
};

// view story controller
export const viewStory = async (req, res) => {
  try {
    const userId = req.userId; // auth middleware
    const storyId = req.params.storyId;
    const story = await Story.findById(storyId);
    if (!story) {
      return res.status(404).json({ message: "Story not found!" });
    }

    const viewersIds = story.viewers.map((id) => id.toString());
    if (viewersIds.includes(userId.toString())) {
      story.viewers = story.viewers.filter(
        (id) => id.toString() !== userId.toString()
      );
    } else {
      story.viewers.push(userId);
    }

    await story.save();
    await story
      .populate("author", "name userName profileImage")
      .populate("viewers", "name userName profileImage");
    return res.status(200).json({ success: true, error: false, story: story });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `viewStory error: ${error.message}` });
  }
};

// get story by userName controller
export const getStoryByUserName = async (req, res) => {
  try {
    const userName = req.params.userName;
    const user = await User.findOne({ userName }).populate("stories");
    if (!user) {
      return res.status(404).json({ message: "User not found!" });
    }

    const story = await Story.findById({
      author: user._id,
    }).populate("author viewers");
    return res
      .status(200)
      .json({ success: true, error: false, stories: story });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `getStoryByUserName error: ${error.message}` });
  }
};

// get all stories of his followers controller
export const getStoriesOfFollowing = async (req, res) => {
  try {
    const userId = req.userId; // auth middleware
    const currentUser = await User.findById(userId).populate("following");
    if (!currentUser) {
      return res.status(404).json({ message: "User not found!" });
    }

    const followingIds = currentUser.following.map((id) => id.toString());
    const stories = await Story.find({ author: { $in: followingIds } })
      .populate("viewers author")
      .sort({ createdAt: -1 });
    return res
      .status(200)
      .json({ success: true, error: false, stories: stories });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `getStoriesOfFollowing error: ${error.message}` });
  }
};

// delete story controller
export const deleteStory = async (req, res) => {
  try {
    const userId = req.userId; // auth middleware
    const storyId = req.params.storyId;
    const story = await Story.findById(storyId);
    if (!story) {
      return res.status(404).json({ message: "Story not found!" });
    }

    // Allow story author OR admin
    if (story.author.toString() !== userId.toString()) {
      return res.status(403).json({ message: "Not authorized" });
    }

    await Story.findByIdAndDelete(storyId);
    return res
      .status(200)
      .json({
        success: true,
        error: false,
        message: "Story deleted successfully",
      });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `deleteStory error: ${error.message}` });
  }
};

// get all stories controller (for admin or influencers accounts)
export const getAllStories = async (req, res) => {
  try {
    const stories = await Story.find().populate("author viewers");
    return res
      .status(200)
      .json({ success: true, error: false, stories: stories });
  } catch (error) {
    return res
      .status(500)
      .json({ message: `getAllStories error: ${error.message}` });
  }
};

