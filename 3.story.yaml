import express from "express";
import isAuthenticated from "../middlewares/isAuthenticated.js";
import { upload } from "../middlewares/multer.js";
import {
  deleteStory,
  getAllStories,
  getStoriesOfFollowing,
  getStoryByUserName,
  uploadStory,
  viewStory,
} from "../controllers/story.controller.js";

const storyRouter = express.Router();

storyRouter.post(
  "/upload",
  isAuthenticated,
  upload.array("media"),
  uploadStory
);

storyRouter.get(
  "/getByUserName/:userName",
  isAuthenticated,
  getStoryByUserName
);

storyRouter.get(
  "/getStoriesOfFollowing",
  isAuthenticated,
  getStoriesOfFollowing
);

storyRouter.post("/view/:storyId", isAuthenticated, viewStory);

storyRouter.post("/delete/:storyId", isAuthenticated, deleteStory);

// =========== Additional Routes ===========
storyRouter.get("/getAllStories", isAuthenticated, getAllStories);

export default storyRouter;

