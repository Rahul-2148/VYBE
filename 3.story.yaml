import { FiPlus } from "react-icons/fi";
import { useNavigate } from "react-router-dom";
import dp from "../assets/dp.jpg";
import { useSelector } from "react-redux";
import axios from "axios";
import { SERVER_URL } from "../App";
import { useState, useEffect } from "react";

const StoryDp = ({ profileImage, userName, story }) => {
  const navigate = useNavigate();
  const { userData } = useSelector((state) => state.user);
  const { storyData, storiesListOfFollowing } = useSelector(
    (state) => state.story
  );
  const [viewed, setViewed] = useState(false);

  useEffect(() => {
    story?.viewers?.some((viewer) => {
      if (
        viewer?._id?.toString() === userData?.user?._id.toString() ||
        viewer?.toString() == userData?.user?._id.toString()
      ) {
        setViewed(true);
      }
    });
  }, [story, userData, storyData, storiesListOfFollowing]);

  const handleViewers = async () => {
    try {
      const result = await axios.get(
        `${SERVER_URL}/api/v1/story/view/${story._id}`,
        {
          withCredentials: true,
        }
      );
      // console.log(result);
    } catch (error) {
      console.error(error);
    }
  };

  const handleClick = () => {
    if (!story && userName === "Your Story") {
      navigate("/upload");
    } else if (story && userName === "Your Story") {
      handleViewers();
      navigate(`/story/${userData?.user?.userName}`);
    } else {
      handleViewers();
      navigate(`/story/${userName}`);
    }
  };

  return (
    <div className="flex flex-col w-[80px] items-center gap-[5px]">
      <div
        className={`w-[80px] h-[80px] rounded-full flex items-center justify-center relative ${
          story
            ? viewed
              ? "bg-gradient-to-b from-blue-500 to-blue-950"
              : "bg-gradient-to-r from-gray-500 to-black-800"
            : null
        }`}
        onClick={handleClick}
      >
        <div className="w-[70px] h-[70px] border-2 border-black rounded-full cursor-pointer overflow-hidden">
          <img
            src={profileImage || dp}
            alt=""
            className="w-full object-cover"
          />
          {!story && userName === "Your Story" && (
            <div>
              <FiPlus className="w-[22px] h-[22px] bg-white text-black cursor-pointer absolute bottom-[5px] right-[5px] rounded-full" />
            </div>
          )}
        </div>
      </div>
      <div className="text-[14px] text-center truncate w-full text-white">
        {userName}
      </div>
    </div>
  );
};

export default StoryDp;

