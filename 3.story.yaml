Hooks/GetAllStoriesOfFollowing.jsx

import axios from "axios";
import { useEffect } from "react";
import { SERVER_URL } from "../App";
import { useDispatch, useSelector } from "react-redux";
import { setStoriesListOfFollowing } from "../redux/storySlice";

const GetAllStoriesOfFollowing = () => {
  const dispatch = useDispatch();
  const { userData } = useSelector((state) => state.user);
  const { storyData } = useSelector((state) => state.story);

  useEffect(() => {
    const fetchAllStoriesOfFollowing = async () => {
      try {
        const result = await axios.get(
          `${SERVER_URL}/api/v1/story/getStoriesOfFollowing`,
          {
            withCredentials: true,
          }
        );
        dispatch(setStoriesListOfFollowing(result?.data?.stories));
      } catch (error) {
        console.log(error);
      }
    };
    fetchAllStoriesOfFollowing();
  }, [dispatch, userData, storyData]);
};

export default GetAllStoriesOfFollowing;

