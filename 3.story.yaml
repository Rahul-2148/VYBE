storySlice.js

import { createSlice } from "@reduxjs/toolkit";

const storySlice = createSlice({
  name: "story",
  initialState: {
    storyData: [],
    storiesListOfFollowing: [],
    currentUserStories: [],
    isLoading: false,
  },
  reducers: {
    setStoryData: (state, action) => {
      state.storyData = action.payload;
    },
    setStoriesListOfFollowing: (state, action) => {
      state.storiesListOfFollowing = action.payload;
    },
    setCurrentUserStories: (state, action) => {
      state.currentUserStories = action.payload;
    },
  },
});

export const {
  setStoryData,
  setStoriesListOfFollowing,
  setCurrentUserStories,
} = storySlice.actions;
export default storySlice.reducer;

