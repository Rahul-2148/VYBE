name: VYBE CI

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vybe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-build:
    name: Client production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: client
      - name: Build
        run: npm run build
        working-directory: client

  admin-build:
    name: Admin production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: admin
      - name: Build
        run: npm run build
        working-directory: admin

  server-checks:
    name: Server syntax and security regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: server
      - name: Run syntax and security regression tests
        run: npm test
        working-directory: server
